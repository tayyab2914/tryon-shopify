# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e6402da7eae1987ee00e07972b341c04"
name = "TryOn"
handle = "solyio-tryon"
application_url = "https://tryon.solyio.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products: forward use. read_orders: powers order-conversion analytics via
# the orders/create webhook. read_orders is protected customer data — request
# access in Partner Dashboard → API access → Protected customer data.
scopes = "read_products,read_orders,read_themes"

[auth]
redirect_urls = [
  "https://tryon.solyio.com/auth/callback",
  "https://tryon.solyio.com/auth/shopify/callback",
  "https://tryon.solyio.com/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Billing — keep Shop.plan / chargeId in sync when a subscription changes
  # (approved, cancelled, frozen, expired) outside the in-app Billing page.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app_subscriptions/update"
  topics = [ "app_subscriptions/update" ]

  # Order-conversion analytics. Requires read_orders (protected customer data —
  # request access in the Partner Dashboard). The handler attributes orders to
  # recent try-ons by product id; it uses no customer PII fields.
  # TEMPORARILY DISABLED while migrating to the new app in org 219199970 — PCD
  # not yet approved on the new app. Re-enable + redeploy after the listing UI
  # grants Protected Customer Data access.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders/create"
  # topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[pos]
embedded = false
