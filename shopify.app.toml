# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e6402da7eae1987ee00e07972b341c04"
name = "TryOn"
handle = "solyio-tryon"
application_url = "https://tryon.solyio.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_themes: dashboard resolves the active main-theme id for the theme-editor
#   deep link (app/routes/app._index.tsx).
# read_orders: powers order-conversion tracking via the orders/create webhook
#   below. This is Protected Customer Data — the webhook will NOT deliver until
#   Shopify grants PCD (Orders) access in Partner Dashboard → API access, and
#   adding it re-prompts existing merchants to re-consent on next load.
# read_products is intentionally omitted (no Products API call yet).
# Keep the SCOPES env var (.env + Vercel) in sync with this value.
scopes = "read_themes,read_orders"

[auth]
redirect_urls = [
  "https://tryon.solyio.com/auth/callback",
  "https://tryon.solyio.com/auth/shopify/callback",
  "https://tryon.solyio.com/api/auth/callback"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Billing — keep Shop.plan / chargeId in sync when a subscription changes
  # (approved, cancelled, frozen, expired) outside the in-app Billing page.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app_subscriptions/update"
  topics = [ "app_subscriptions/update" ]

  # Order-conversion analytics. Requires read_orders (Protected Customer Data —
  # request access in Partner Dashboard → API access). The handler attributes
  # orders to recent try-ons by product id; it reads no customer PII fields.
  # Will only deliver once PCD (Orders) access is approved for this app.
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[pos]
embedded = false
